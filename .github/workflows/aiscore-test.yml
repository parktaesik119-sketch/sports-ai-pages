name: AiScore 접근 테스트 (1회성)

on:
  workflow_dispatch:

jobs:
  test-aiscore-access:
    runs-on: ubuntu-latest
    steps:
      - name: Node 버전 확인
        run: node --version

      - name: aiscore.com 직접 호출 테스트 (GitHub Actions IP, 프록시 경유 없음)
        run: |
          node -e "
          (async () => {
            const url = 'https://m.aiscore.com/ko/match-gangwon-fc-fc-seoul/jek33idpdzxi9ko/lineups';
            try {
              const res = await fetch(url, {
                headers: {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                  'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                  'Accept-Language': 'ko-KR,ko;q=0.9',
                }
              });
              const text = await res.text();
              console.log('=== 결과 ===');
              console.log('HTTP 상태코드:', res.status);
              console.log('응답 크기:', text.length, '바이트');
              console.log('포메이션 문자열(3-4-3) 포함 여부:', text.includes('3-4-3'));
              console.log('선수명(박상혁) 포함 여부:', text.includes('박상혁'));
              console.log('');
              console.log('=== 응답 앞부분 800자 (차단 페이지인지 실제 데이터인지 확인용) ===');
              console.log(text.slice(0, 800));
            } catch (err) {
              console.error('요청 자체 실패(네트워크/DNS/TLS 등):', err.message);
              process.exitCode = 1;
            }
          })();
          "