name: Deploy on Push

# main.yml/lineup-update.yml이 GITHUB_TOKEN으로 push하는 건 GitHub 정책상
# 이 워크플로우를 다시 트리거하지 않음(재귀 방지) → 중복 빌드 걱정 없음.
# 즉 이 워크플로우는 "그 두 워크플로우를 거치지 않은 push"(로컬 수정, GitHub 웹 편집 등)를
# 잡아내기 위한 안전망 역할.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 의존성 설치
        run: npm install

      - name: 사이트 빌드
        run: npx astro sync && npm run build

      - name: Cloudflare Pages 배포
        run: npx wrangler pages deploy dist --project-name=sports-ai-pages --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}