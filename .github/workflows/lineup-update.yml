name: Lineup Update

on:
  # schedule: 블록 제거함 - GitHub 자체 cron은 지연이 심해서(1.5~4시간)
  # 외부 Cloudflare Worker(github-actions-dispatcher)가 30분마다 정확한 시각에
  # workflow_dispatch로 대신 호출하는 방식으로 변경.
  workflow_dispatch:      # 수동 실행 가능

jobs:
  lineup-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 사이트 빌드(npm run build)에는 패키지가 필요하지만, 라인업 스크립트 자체는 외부 패키지가 없어도 됨
      - name: Install dependencies
        run: npm install

      # notify-lineup-telegram.js가 "이번 실행에서 뭐가 바뀌었는지" 비교할 기준점.
      # 반드시 아래 라인업 스크립트들(UEFA/ESPN/KBO/NPB/KBL)이 실행되기 "전"에 캡처해야 함.
      - name: Capture starting commit hash
        id: before
        run: echo "hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run UEFA lineup update script
        run: node scripts/uefa-lineup-update.js

      - name: Run footystats update script
        run: node scripts/footystats/footystats-lineup-update.js
        continue-on-error: true
        env:
          HOME_PROXY_URL: ${{ secrets.HOME_PROXY_URL }}
          HOME_PROXY_SECRET: ${{ secrets.HOME_PROXY_SECRET }}
          CF_SESSION_COOKIE: ${{ secrets.CF_SESSION_COOKIE }}
          CF_SESSION_USER_AGENT: ${{ secrets.CF_SESSION_USER_AGENT }}

      - name: Run ESPN lineup update script
        run: node scripts/espn-boxscore-update.js

      - name: Run KBO lineup update script
        run: node scripts/kbo-lineup-update.js

      - name: Run NPB lineup update script
        run: node scripts/npb-lineup-update.js

      - name: Run KBL lineup update script
        run: node scripts/kbl-lineup-update.js

      - name: Run KBO photo update
        run: node scripts/kbo-photo-update.js

      - name: Commit and push lineup updates
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/posts/
          git add scripts/footystats/team-map-cache.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 없음"
          else
            git commit -m "lineup: update starting lineups"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 이번 실행에서 라인업이 채워진 글들을 모아 텔레그램으로 알림 (커밋 성공했을 때만)
      - name: Notify lineup updates via Telegram
        if: steps.push.outputs.changed == 'true'
        run: node scripts/notify-lineup-telegram.js "${{ steps.before.outputs.hash }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # notify 스크립트가 로컬에 갱신해둔 "이미 알림 보낸 글" 상태를 커밋/푸시.
      # 이 단계가 없으면 상태 파일 변경이 잡 종료와 함께 사라져서
      # 다음 실행 때 항상 빈 상태로 리셋되고 중복 알림이 재발함.
      - name: Commit lineup notification state
        if: steps.push.outputs.changed == 'true'
        run: |
          git add scripts/.lineup-notified-state.json
          if git diff --staged --quiet; then
            echo "알림 상태 변경 없음"
          else
            git commit -m "chore: update lineup notification state"
            git push
          fi

      # 사이트 빌드 (변경사항 있을 때만) - Cloudflare 자동빌드 대신 여기서 직접 빌드
      - name: 사이트 빌드
        if: steps.push.outputs.changed == 'true'
        run: npx astro sync && npm run build

      # Cloudflare Pages에 Direct Upload로 배포 (빌드 횟수 500회 한도 대상 아님)
      - name: Cloudflare Pages 배포
        if: steps.push.outputs.changed == 'true'
        run: npx wrangler pages deploy dist --project-name=sports-ai-pages --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}