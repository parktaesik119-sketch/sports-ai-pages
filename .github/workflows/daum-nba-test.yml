
name: Daum NBA API Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 다음 스포츠 NBA API 단일 호출 테스트
        shell: bash
        run: |
          set -e

          URL="https://sports.daum.net/api/arms/SPORTS_SCHEDULE?leagueCode=nba&fromDate=20261029&toDate=20261203&seasonKey=20262027"

          echo "======================================"
          echo "Daum NBA API 연결 테스트"
          echo "======================================"

          HTTP_CODE=$(curl -sS -L \
            --max-time 25 \
            -D /tmp/daum-headers.txt \
            -o /tmp/daum-response.json \
            -w "%{http_code}" \
            -H "Referer: https://sports.daum.net/schedule/nba?teamId=79953" \
            -H "Origin: https://sports.daum.net" \
            -H "Accept: application/json, text/plain, */*" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36" \
            "$URL")

          echo ""
          echo "HTTP 상태 코드: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "API 요청 실패"
            echo "응답 헤더:"
            cat /tmp/daum-headers.txt
            echo "응답 내용:"
            head -c 2000 /tmp/daum-response.json
            exit 1
          fi

          echo ""
          echo "JSON 데이터 분석 시작"

          node <<'NODE'
          const fs = require("fs");

          const raw = fs.readFileSync("/tmp/daum-response.json", "utf8");
          const data = JSON.parse(raw);

          console.log("API 응답 코드:", data.code);

          const schedule = data.document?.schedule;

          if (!schedule || typeof schedule !== "object") {
            console.error("경기 일정 데이터가 없습니다.");
            process.exit(1);
          }

          const dates = Object.keys(schedule);
          const games = Object.values(schedule).flat();

          console.log("일정 날짜 수:", dates.length);
          console.log("전체 경기 수:", games.length);

          if (games.length === 0) {
            console.error("경기 데이터가 비어 있습니다.");
            process.exit(1);
          }

          console.log("");
          console.log("===== 경기 데이터 샘플 =====");

          for (const game of games.slice(0, 5)) {
            console.log({
              date: game.startDate,
              time: game.startTime,
              away: game.awayTeamName,
              home: game.homeTeamName,
              awayScore: game.awayResult,
              homeScore: game.homeResult,
              status: game.gameStatus,
              gameId: game.gameId
            });
          }

          console.log("");
          console.log("NBA 일정 데이터 수집 성공!");
          NODE
