name: Pick Heaven Auto Post

on:
  schedule:
    # 한국 시간 기준 오전 6시 (UTC 21:00 - 전날)
    # 한국 시간 기준 오후 6시 (UTC 09:00)
    - cron: '0 21 9 * *'
  workflow_dispatch: # 수동으로 즉시 실행해볼 수 있는 버튼 생성

permissions:
  contents: write  

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Node.js 설정
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 의존성 설치
        run: npm install

      - name: 데이터 수집 및 AI 분석 실행
        run: node scripts/main-auto.js
        env:
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
          MISTRAL_KEYS: ${{ secrets.MISTRAL_KEYS }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          PANDASCORE_KEY: ${{ secrets.PANDASCORE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          RAPID_KEY: ${{ secrets.RAPID_KEY }}

      - name: 생성된 글을 깃허브에 푸쉬
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          # 1. 바뀐 내용(분석글 등)이 있을 때만 커밋을 생성합니다.
          git diff --quiet && git diff --staged --quiet || (git commit -m "자동 분석글 업로드")
          
          # 2. ✅ (가장 중요) 서버의 최신 상태(삭제된 폴더 등)를 가져와 내 PC 내용과 합칩니다.
          git pull --rebase origin main
          
          # 3. 최종적으로 합쳐진 내용을 깃허브 서버에 올립니다.
          git push origin main