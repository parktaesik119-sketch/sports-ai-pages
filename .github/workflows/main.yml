name: Pick Heaven Auto Post

on:
  schedule:
   
    # 🌙 2회차 - KST 오후 9시 11분 (UTC 12:11)
    # UTC 당일 낮 → d와 d+1 수집
    # 1회차 이후 새로 추가된 경기일정 보충
    - cron: '11 12 * * *'


  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 저장소 체크아웃
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node.js 설치
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 패키지 설치
      - name: 의존성 설치
        run: npm install

      # 자동 분석 실행
      - name: 데이터 수집 및 AI 분석 실행
        run: node scripts/main-auto.js
        env:
          ROUTERONE_KEY: ${{ secrets.ROUTERONE_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          PANDASCORE_KEY: ${{ secrets.PANDASCORE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          RAPID_KEY: ${{ secrets.RAPID_KEY }}

      # 생성 파일 자동 커밋 및 푸쉬
      - name: 생성된 글을 깃허브에 푸쉬
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 생성된 파일 추가
          git add .

          # 변경사항 있을 때만 커밋
          if [ -n "$(git status --porcelain)" ]; then

            git commit -m "🤖 자동 분석글 및 데이터 업데이트"

            # 로컬 작업과 충돌 방지용 최신 main 반영
            git pull --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main

            # 푸쉬
            git push

          else
            echo "업데이트할 파일이 없습니다."
          fi
