
name: Pick Heaven Auto Post

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: 현재 커밋 해시 저장
        id: before
        run: echo "hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 의존성 설치
        run: npm install

      - name: 네이버 API Chrome TLS 실행 환경 설치
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/naver-curl-cffi"
          "$RUNNER_TEMP/naver-curl-cffi/bin/pip" install curl_cffi
          echo "NAVER_PYTHON=$RUNNER_TEMP/naver-curl-cffi/bin/python" >> "$GITHUB_ENV"

      - name: 네이버 API 실행 환경 진단
        shell: bash
        run: |
          echo "===== Python 버전 ====="
          "$NAVER_PYTHON" --version

          echo "===== curl_cffi 버전 ====="
          "$NAVER_PYTHON" -m pip show curl_cffi

          echo "===== curl_cffi 불러오기 테스트 ====="
          "$NAVER_PYTHON" -c "from curl_cffi import requests; print('curl_cffi import OK')"

      - name: 데이터 수집 및 AI 분석 실행
        run: node scripts/main-auto.js
        env:
          ROUTERONE_KEY: ${{ secrets.ROUTERONE_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          PANDASCORE_KEY: ${{ secrets.PANDASCORE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          RAPID_KEY: ${{ secrets.RAPID_KEY }}
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}

      - name: 생성된 글을 깃허브에 푸쉬
        id: push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "🤖 자동 분석글 및 데이터 업데이트"
            git pull --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "업데이트할 파일이 없습니다."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 사이트 빌드
        if: steps.push.outputs.changed == 'true'
        run: npx astro sync && npm run build

      - name: Cloudflare Pages 배포
        if: steps.push.outputs.changed == 'true'
        run: npx wrangler pages deploy dist --project-name=sports-ai-pages --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 텔레그램 알림 발송
        run: node scripts/notify-posts-telegram.js "${{ steps.before.outputs.hash }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
