name: Pick Heaven Auto Post

on:
  schedule:
    # 한국 시간 기준 오전 6시 (UTC 21:00 - 전날)
    - cron: '0 21 * * *'
    # 한국 시간 기준 오후 6시 (UTC 09:00)
    - cron: '0 9 * * *'
  workflow_dispatch: # 수동으로 즉시 실행해볼 수 있는 버튼 생성

permissions:
  contents: write  

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Node.js 설정
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 의존성 설치
        run: npm install

      - name: 데이터 수집 및 AI 분석 실행
        run: node scripts/main-auto.js
        env:
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
          MISTRAL_KEYS: ${{ secrets.MISTRAL_KEYS }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          PANDASCORE_KEY: ${{ secrets.PANDASCORE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          RAPID_KEY: ${{ secrets.RAPID_KEY }}

      - name: 생성된 글을 깃허브에 푸쉬
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. 꼬인 파일들 강제 정리
          git reset --hard HEAD
          git clean -fd
          
          # 2. 최신 상태 불러오기
          git pull --rebase origin main
          
          # 3. 분석 다시 실행 (파일이 reset으로 날아갔을 경우를 대비)
          node scripts/main-auto.js
          
          # 4. 생성된 모든 파일(글+데이터)을 강제로 추가
          git add .
          
          # 5. 변경사항이 있을 때만 커밋 및 푸쉬
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "🤖 자동 분석글 및 데이터 업데이트"
            git push origin main
          else
            echo "업데이트할 파일이 없습니다."
          fi
