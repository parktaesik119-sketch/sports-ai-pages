name: Pick Heaven Auto Post

on:
  # schedule: 블록은 제거함 - GitHub 자체 cron은 몇 시간씩 지연되는 문제가 있어서
  # 외부 Cloudflare Worker가 정확한 시각에 workflow_dispatch로 대신 호출하는 방식으로 변경.
  # (schedule과 workflow_dispatch를 동시에 두면 같은 작업이 중복 실행될 위험이 있어 schedule은 제거)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 저장소 체크아웃
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node.js 설치
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 커밋 전 해시 저장 (텔레그램 알림용 diff 기준점)
      - name: 현재 커밋 해시 저장
        id: before
        run: echo "hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 패키지 설치
      - name: 의존성 설치
        run: npm install

      # 자동 분석 실행
      - name: 데이터 수집 및 AI 분석 실행
        run: node scripts/main-auto.js
        env:
          ROUTERONE_KEY: ${{ secrets.ROUTERONE_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          PANDASCORE_KEY: ${{ secrets.PANDASCORE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          RAPID_KEY: ${{ secrets.RAPID_KEY }}

      # 생성 파일 자동 커밋 및 푸쉬
      - name: 생성된 글을 깃허브에 푸쉬
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 생성된 파일 추가
          git add .

          # 변경사항 있을 때만 커밋
          if [ -n "$(git status --porcelain)" ]; then

            git commit -m "🤖 자동 분석글 및 데이터 업데이트"

            # 로컬 작업과 충돌 방지용 최신 main 반영
            git pull --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main

            # 푸쉬
            git push

          else
            echo "업데이트할 파일이 없습니다."
          fi

      # 신규 분석글 텔레그램 알림
      - name: 텔레그램 알림 발송
        run: node scripts/notify-posts-telegram.js "${{ steps.before.outputs.hash }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}