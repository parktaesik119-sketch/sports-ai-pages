
name: Pick Heaven Auto Post

on:
  # Cloudflare Worker가 workflow_dispatch로 실행
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 저장소 체크아웃
      - name: 저장소 가져오기
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Node.js 설치
      - name: Node.js 설정
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # 커밋 전 해시 저장 (텔레그램 알림용 diff 기준점)
      - name: 현재 커밋 해시 저장
        id: before
        run: echo "hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 패키지 설치
      - name: 의존성 설치
        run: npm install

      # 네이버 API Chromium 응답 확인
      - name: Naver API Chromium Response Test
        shell: bash
        run: |
          TEST_DIR="$RUNNER_TEMP/naver-browser-test"
          mkdir -p "$TEST_DIR"
          cd "$TEST_DIR"

          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

          cat > test.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage();

            const url = 'https://api-gw.sports.naver.com/schedule/games?fields=basic%2Cschedule%2Cbaseball%2CmanualRelayUrl&upperCategoryId=kbaseball&fromDate=2026-11-04&toDate=2026-11-10&size=500';

            page.on('requestfailed', request => {
              console.log(
                '요청 실패:',
                request.url(),
                request.failure()?.errorText
              );
            });

            page.on('response', response => {
              console.log(
                '응답 수신:',
                response.status(),
                response.url()
              );
            });

            try {
              console.log('===== Chromium 응답 확인 테스트 =====');

              const response = await page.goto(url, {
                waitUntil: 'commit',
                timeout: 30000
              });

              console.log(
                '응답 헤더 수신 상태:',
                response?.status()
              );

              const result = await page.locator('body').innerText({
                timeout: 15000
              });

              console.log(
                '응답 본문:',
                result.slice(0, 1000)
              );

              if (!response || response.status() !== 200) {
                process.exitCode = 1;
              }

            } catch (error) {
              console.error('테스트 오류:', error.message);
              process.exitCode = 1;

            } finally {
              await browser.close();
            }
          })();
          EOF

          node test.js

      # 자동 분석 실행
      - name: 데이터 수집 및 AI 분석 실행
        run: node scripts/main-auto.js
        env:
          ROUTERONE_KEY: ${{ secrets.ROUTERONE_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          PANDASCORE_KEY: ${{ secrets.PANDASCORE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          RAPID_KEY: ${{ secrets.RAPID_KEY }}
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}

      # 생성 파일 자동 커밋 및 푸쉬
      - name: 생성된 글을 깃허브에 푸쉬
        id: push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if [ -n "$(git status --porcelain)" ]; then

            git commit -m "🤖 자동 분석글 및 데이터 업데이트"

            git pull --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main

            git push

            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "업데이트할 파일이 없습니다."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # 사이트 빌드
      - name: 사이트 빌드
        if: steps.push.outputs.changed == 'true'
        run: npx astro sync && npm run build

      # Cloudflare Pages 배포
      - name: Cloudflare Pages 배포
        if: steps.push.outputs.changed == 'true'
        run: npx wrangler pages deploy dist --project-name=sports-ai-pages --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 신규 분석글 텔레그램 알림
      - name: 텔레그램 알림 발송
        run: node scripts/notify-posts-telegram.js "${{ steps.before.outputs.hash }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
