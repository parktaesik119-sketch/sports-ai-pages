name: Pick Heaven Auto Post

on:
  schedule:
    # 한국 시간 기준 오전 6시 (UTC 21:00 - 전날)
    - cron: '0 21 * * *'
    # 한국 시간 기준 오후 6시 (UTC 09:00)
    - cron: '0 9 * * *'
  workflow_dispatch: # 수동으로 즉시 실행해볼 수 있는 버튼 생성

permissions:
  contents: write  

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Node.js 설정
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 의존성 설치
        run: npm install

      - name: 데이터 수집 및 AI 분석 실행
        run: node scripts/main-auto.js
        env:
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
          MISTRAL_KEYS: ${{ secrets.MISTRAL_KEYS }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          PANDASCORE_KEY: ${{ secrets.PANDASCORE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          RAPID_KEY: ${{ secrets.RAPID_KEY }}

      - name: 생성된 글을 깃허브에 푸쉬
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git stash
          git pull --rebase origin main
          git stash pop || echo "No changes to pop"
          git add src/content/posts/*.md
          git commit -m "🤖 자동 분석글 업데이트" || exit 0
          git push origin main
